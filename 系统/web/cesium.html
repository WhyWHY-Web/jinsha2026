<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金沙江实景三维 · Cesium</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css">
<style>
  html,body,#cesiumContainer{height:100%;margin:0;background:#05090d;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  .hud{position:absolute;z-index:20;background:rgba(8,16,22,.82);backdrop-filter:blur(10px);
    border:1px solid rgba(64,205,178,.22);border-radius:10px;color:#d9ecec}
  #top{left:16px;top:14px;padding:12px 16px;min-width:250px}
  #top .k{font-size:9px;letter-spacing:.22em;color:#35e0b8}
  #top h1{font-size:15px;margin:5px 0 3px;font-weight:600;letter-spacing:1px}
  #top p{font-size:10.5px;color:#6f8f96;margin:0}
  #top .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{height:28px;padding:0 11px;border-radius:6px;border:1px solid rgba(64,205,178,.3);
    background:rgba(53,224,184,.08);color:#9fe8d4;font-size:11.5px;cursor:pointer}
  .btn:hover{background:rgba(53,224,184,.18)}
  .btn.pri{background:linear-gradient(180deg,#3fdca9,#1fa97c);color:#04211a;border:0;font-weight:600}
  #tip{right:16px;bottom:16px;padding:8px 12px;font-size:10.5px;color:#7fa3a8}
  #legend{left:16px;bottom:16px;padding:9px 12px;font-size:10.5px;color:#9fb2b5}
  #legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
  #load{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:#05090d;color:#7fa3a8;font-size:13px;letter-spacing:2px;transition:opacity .5s}
  #load.hide{opacity:0;pointer-events:none}
  .cesium-infoBox{background:rgba(8,16,22,.94)!important;color:#d9ecec!important}
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="load">正在接入全球地形与影像…</div>

<div class="hud" id="top">
  <div class="k">REAL 3D · CESIUM</div>
  <h1>金沙江流域 · 实景三维</h1>
  <p>全球流式地形 + 真实影像 · 从流域缩到河谷连续加载</p>
  <div class="row">
    <button class="btn pri" id="btnBasin">回到流域</button>
    <button class="btn" id="btnRiver">沿江飞行</button>
    <button class="btn" id="btnBack">返回大屏</button>
  </div>
</div>

<div class="hud" id="legend">
  <div><i style="background:#ff5a5a"></i>高风险　<i style="background:#ffb03a"></i>中风险　<i style="background:#4ade80"></i>低风险</div>
</div>
<div class="hud" id="tip">滚轮缩放 · 左键旋转 · 右键平移 · 点击站点看详情</div>

<script>
  window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/';
</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
<script>
(function(){
  var TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjlOdUJFaHg5R0pVdHpHckUiLCJqdGkiOiJmMmJlNjhhOC05ZDQ0LTQ4NjUtYjEwNS03NmRkMmE0NjFhZDkiLCJpZCI6NTMzODI1LCJzdWIiOiJ3aHl3aHl3aHkiLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoiamluc2hhIiwiaWF0IjoxNzkyODMzMzQ2fQ.plV2ygpuNDJZQoPHhvqrNa9NCSDT9GD62FGuvP4n1Yg';
  Cesium.Ion.defaultAccessToken = TOKEN;

  /* 用瓦片模板直连，避免 ArcGIS provider 的元数据异步初始化问题 */
  var esri = new Cesium.UrlTemplateImageryProvider({
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    maximumLevel: 19,
    credit: 'Esri World Imagery'
  });

  var viewer = new Cesium.Viewer('cesiumContainer', {
    animation:false, timeline:false, baseLayerPicker:false, geocoder:false,
    homeButton:false, sceneModePicker:false, navigationHelpButton:false,
    fullscreenButton:false, infoBox:true, selectionIndicator:false,
    baseLayer: new Cesium.ImageryLayer(esri),
    contextOptions: { webgl: { alpha: false } }
  });
  window.viewer = viewer;
  viewer.scene.globe.depthTestAgainstTerrain = true;
  viewer.scene.skyAtmosphere.show = true;
  viewer.scene.fog.enabled = true;

  /* 地形兜底：ion 不可用时换 ArcGIS 全球地形 */
  /* 地形：1.121 必须用 fromUrl 异步创建，直接 new 会让球面不渲染 */
  Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
    'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'
  ).then(function(tp){
    viewer.scene.setTerrain(new Cesium.Terrain(tp));
    document.getElementById('load').classList.add('hide');
  }).catch(function(){
    document.getElementById('load').classList.add('hide');
  });
  setTimeout(function(){ document.getElementById('load').classList.add('hide'); }, 8000);


  var BASIN = { lon: 100.6, lat: 28.4, height: 420000 };
  function flyBasin(){
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(BASIN.lon, BASIN.lat, BASIN.height),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-62), roll: 0 },
      duration: 2.0
    });
  }
  flyBasin();

  /* 站点 */
  var COLORS = { '高风险':'#ff5a5a', '中风险':'#ffb03a', '低风险':'#4ade80' };
  fetch('/api/legacy/stations', { credentials:'same-origin' })
    .then(function(r){ return r.json(); })
    .then(function(list){
      (list||[]).forEach(function(s){
        var c = Cesium.Color.fromCssColorString(COLORS[s['风险评级']] || '#4ade80');
        viewer.entities.add({
          name: s['名称'],
          position: Cesium.Cartesian3.fromDegrees(s['经度'], s['纬度'], (s['海拔']||0)+30),
          point: { pixelSize: 9, color: c, outlineColor: Cesium.Color.WHITE, outlineWidth: 1.5,
                   heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: 0 },
          label: {
            text: s['名称'], font: '13px Microsoft YaHei', fillColor: Cesium.Color.WHITE,
            showBackground: true, backgroundColor: Cesium.Color.fromCssColorString('rgba(6,18,24,.72)'),
            backgroundPadding: new Cesium.Cartesian2(7,4), pixelOffset: new Cesium.Cartesian2(0,-18),
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: 0, distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 600000)
          },
          description:
            '<div style="font-size:12px;line-height:1.9">'+
            '<b>'+s['名称']+'</b>　'+s['分区名']+'<br>'+
            '海拔 '+s['海拔']+' m　坡度 '+(s['坡度']||'—')+'°<br>'+
            '林地 '+(Math.round((s['树冠覆盖']||0)*100))+'%　覆盖度 '+(Math.round((s['植被覆盖']||0)*100))+'%<br>'+
            '碳密度 '+(s['碳密度']||'—')+' tC/ha<br>'+
            '风险：<b>'+s['风险评级']+'</b>（'+(s['综合风险']||'—')+'）</div>'
        });
      });
    }).catch(function(){});

  document.getElementById('btnBasin').onclick = flyBasin;
  document.getElementById('btnBack').onclick = function(){ location.href='/'; };
  document.getElementById('btnRiver').onclick = function(){
    /* 沿干流低空飞行：分段飞过 5 个关键点 */
    var pts = [
      [98.60,31.80, 30000],[99.30,28.24, 26000],[99.98,26.88, 22000],
      [101.72,26.58, 22000],[103.66,28.24, 22000],[104.40,28.65, 18000]
    ];
    var i = 0;
    (function next(){
      if(i>=pts.length) return;
      var p = pts[i++];
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(p[0], p[1], p[2]),
        orientation: { heading: Cesium.Math.toRadians(20), pitch: Cesium.Math.toRadians(-38), roll: 0 },
        duration: 4.0, complete: function(){ setTimeout(next, 900); }
      });
    })();
  };
})();
</script>
</body>
</html>
