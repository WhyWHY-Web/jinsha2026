# Cloudflare 命名隧道配置模板
# 用法：把 tunnel 换成 `cloudflared tunnel create jinsha` 生成的 ID，
#      把 hostname 换成你买的域名，然后执行：
#      tools\bin\cloudflared.exe tunnel --config tools\named-tunnel.yml run

tunnel: 在这里填隧道ID
credentials-file: C:\Users\19682\.cloudflared\在这里填隧道ID.json

ingress:
  - hostname: jinsha2026why.com
    service: http://127.0.0.1:8080
  - hostname: www.jinsha2026why.com
    service: http://127.0.0.1:8080
  - service: http_status:404
